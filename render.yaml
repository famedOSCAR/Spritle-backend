services:
  - type: web
    name: spritle-backend
    runtime: node
    plan: free
    buildCommand: "npm install --omit=dev"
    startCommand: "node server.js"

    envVars:
      NODE_VERSION: 22
      NPM_CONFIG_PRODUCTION: true
      PORT: 3000
    
    healthCheckPath: "/api/stats"

    autoDeploy: true
